name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_DIR: ${{ runner.temp }}/fma-state
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail if credentials are tracked
        run: |
          mkdir -p "$STATE_DIR"
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed to the repo — it must stay gitignored"
            exit 1
          fi
          echo "no .env tracked"

      - name: Byte-compile every module
        run: python -m py_compile *.py engine/*.py tests/*.py

      - name: Run test suites
        run: |
          status=0
          for suite in tests/test_*.py; do
            echo "::group::$suite"
            if timeout 300 python "$suite"; then
              echo "PASS  $suite"
            else
              echo "::error::FAILED $suite"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
